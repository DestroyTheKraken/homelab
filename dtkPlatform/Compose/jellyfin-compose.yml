# Active DTK platform copy for Portainer / GitOps-lite.
# Origin template: HOME_LAB/hickMedia/compose/jellyfin/docker-compose.yml
# Prefer deploying via Portainer stack UI on node1 (tag:media).
#
# Manual / Portainer env:
#   MEDIA=/srv/mediahub/media
#   mkdir -p ./config ./cache "$MEDIA"/{movies,tv,music}

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    # Override user to match the account that owns media files
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${MEDIA:-/srv/mediahub/media}:/media
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL:-http://127.0.0.1:8096}
    mem_limit: 3g
    cpus: 2.0
